<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sermon Assist — Stage</title>
<style>
  html,body{height:100%;margin:0;background:#0e1310;}
  .stage{
    height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:0 8%;color:#f5f1e6;font-family:"Iowan Old Style",Georgia,serif;
  }
  .verse{font-size:3vw;line-height:1.4;max-width:1000px;}
  .ref{font-family:-apple-system,Arial,sans-serif;margin-top:32px;font-size:1.6vw;color:#9CA3AA;letter-spacing:0.5px;}
  .version{font-family:-apple-system,Arial,sans-serif;font-size:1vw;color:rgba(245,241,230,0.45);margin-top:6px;}
  .empty{opacity:0.15;font-family:-apple-system,Arial,sans-serif;font-size:1.2vw;}
</style></head>
<body>
  <div class="stage" id="stage"><div class="empty">Screen idle — no scripture projected</div></div>
<script>
async function render(){
  const res = await fetch('/api/state');
  const s = await res.json();
  const el = document.getElementById('stage');
  if (s.projected) {
    el.innerHTML = `
      <div class="verse">"${s.projected.text}"</div>
      <div class="ref">${s.projected.reference}</div>
      <div class="version">${s.projected.version}</div>`;
  } else {
    el.innerHTML = `<div class="empty">Screen idle — no scripture projected</div>`;
  }
}
setInterval(render, 1000);
render();
</script>
</body></html>
